
<div>
  <h1>Hello, listeners!</h1>

</div>
<div *ngIf="true" class="search_ontop search_container"  [ngClass]="{'search_ontop_bellow': true}">
  <input [typeahead]="audioTitles" [(ngModel)]="selected" placeholder="Search audio..."
       class="form-control bg-danger search_input" (input)="onInputChange($event)" [typeaheadOptionsLimit]="7" (typeaheadOnSelect)="onSearchSelected($event)">
       <i class="search_icon">🔎</i>
       @if (selected) {
        <i class="Clear_icon" (click)="clearInput()">X</i>
       }
</div>

<div class="book-container" *ngFor="let book of this.subtitles; let bookIndex = index">
  <div class="expander" [attr.aria-expanded]="book.expanded">
    <button class="expander__header" (click)="toggleExpand(book)">
      <div class="expander__title">
        <h2>{{ book.title }}</h2>
        <p class="expander__subtitle">{{ book.subtitle }}</p>
      </div>
      <div class="chev">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"
                    [attr.transform]="book.expanded ? 'rotate(180,12,12)' : ''">
          </polyline>
        </svg>
      </div>
    </button>

    <div class="expander__content" [class.show]="book.expanded">
      <ul class="sub-list">
        <li class="sub-item" *ngFor="let sub of book.parts; let i = index">
          <button type="button" (click)="onSubClick(bookIndex, i, sub)">
            <span class="dot"></span>
            <span class="label">{{ sub.label }}</span>
          </button>

          <audio
            *ngIf="activeIndex[bookIndex] === i && videoUrl"
            [src]="videoUrl()"
            controls
            preload="metadata"
            style="width: 100%; margin-top: 8px;"
          ></audio>
        </li>
      </ul>
    </div>
  </div>
</div>
@if (show) {
<div class="book-title">
    <div  class="book-container" *ngFor="let book of this.audioTitles; let bookIndex = index">
      <div class="expander" [attr.aria-expanded]="book.expanded">
        <button class="expander__header" (click)="getBook(book)">
          <div class="expander__title">
            <h2>{{ book|replaceUS }}</h2>
          </div>
        </button>
      </div>
    </div>
</div>
}
