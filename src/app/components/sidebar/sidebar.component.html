<div class="sidebar">
  <div class="workspace">
    <span>
      {{ workspace().name }}
    </span>

    <span>⌄</span>
  </div>

  <div class="sidebar-content">
    @if (channels$ | async; as channels) { @for (section of sections(); track
    section.id) {

    <div class="section">
      <!-- SECTION HEADER -->
      <div class="section-title" (click)="toggleSection(section.id)">
        <span>
          {{ section.expanded ? "▼" : "▶" }}
        </span>

        <span>
          {{ section.name }}
        </span>

        <button
          type="button"
          (click)="$event.stopPropagation(); createChannel()"
        >
          +
        </button>
      </div>

      <!-- CHANNELS -->

      @if (section.expanded) { @for (channel of section.channels; track
      channel.id) {

      <div
        class="channel-row"
        [class.active]="selectedChannel()?.id === channel.id"
      >
        <button class="channel-item" (click)="selectChannel(channel)">
          <span>#</span>

          <span class="channel-name">
            {{ channel.name }}
          </span>

          @if (messageCounts()[channel.id] > 0) {
          <span class="message-count">
            {{ messageCounts()[channel.id] }}
          </span>
          } @if (unreadCounts()[channel.id] > 0) {
          <span class="unread-badge">
            {{ unreadCounts()[channel.id] }}
          </span>
          }
        </button>

        <select
          [value]="channel.sectionId ?? 'other'"
          (change)="moveChannelToSection(channel, $any($event.target).value)"
          (click)="$event.stopPropagation()"
        >
          @for ( targetSection of sections(); track targetSection.id ) {

          <option [value]="targetSection.id">
            {{ targetSection.name }}
          </option>

          }
        </select>
      </div>

      } }
    </div>

    } }
  </div>
</div>
